# ============================================================
# 压测用最小上游（nginx）：所有路径恒返回 200 JSON
# 目的：隔离 BFF 自身开销（代理/注入/熔断等），不给上游引入抖动
#
# 运行（宿主机 9091 端口，与 config 中 localhost:9091 对齐）：
#   docker run -d --name bff-loadtest-upstream --network host \
#     -v "$PWD/benchmark/upstream-nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:1.27-alpine
# ============================================================
server {
    listen 9091;
    server_name _;
    access_log off;

    location / {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"loadtest":true,"service":"benchmark-upstream"}';
    }
}
