# cargo-audit 配置（RustSec 审计例外清单）
#
# 每一项都必须有：整改说明 + 影响范围界定。禁止“静默忽略”。
# CI 中由 rustsec/audit-check 执行审计并读取本文件。

[advisories]
ignore = [
    # serde_yaml 0.9.34+deprecated 已停维（RUSTSEC-2024-0320）。
    # 引入链：figment 0.10（启动配置加载）→ serde_yaml。BFF 直接使用处：
    #   - src/config.rs（配置加载/持久化）
    #   - src/admin/config_api.rs（import 解析）
    #   - 测试与管线 YAML 解析
    # 影响界定：这是“unmaintained”公告而非在野漏洞；解析对象为受信来源
    # （本地配置文件 + 持 token 的管理操作），且管理请求体上限 8 MiB。
    # 整改计划：跟踪 figment 上游迁移（如上游切换 serde_yaml_ng），
    # 或替换配置层为自研合并 + serde_norway/serde_yaml_ng。
    "RUSTSEC-2024-0320",

    # rustls-pemfile 2.2.0 停维（RUSTSEC-2025-0134，2025-11-28）。
    # 引入链：tonic 0.12（OTLP/gRPC 导出栈）→ rustls-pemfile。
    # 影响界定：unmaintained 公告（无在野漏洞）。BFF 仅以**客户端**身份使用 tonic
    # （OTLP 导出；TLS 走 rustls/tls-roots 读系统证书库），不解析外部 PEM 材料，
    # 该 crate 的维护缺口（PEM 解析）不构成运行时暴露面。
    # 整改计划：随 OTel 栈升级（opentelemetry-otlp 0.27 → 更高版本 / tonic 0.13+）
    # 整体移除；升级需回归 tests/test_telemetry.rs 的进程内 collector 契约。
    "RUSTSEC-2025-0134",

    # 说明：原 reqwest 0.11 旧栈例外（h2 0.3 / rustls-webpki 0.101）已随
    # openidconnect 4.0 / oauth2 5 / reqwest 0.12 迁移清零，不再需要例外。
    # 当前审计结果：仅余「停维」类与「私钥运算不可达」类告警，无在野漏洞类告警。

    # rsa 0.9.10 Marvin 计时侧信道（RUSTSEC-2023-0071；上游无修复版本）。
    # 引入链：openidconnect → rsa（RS256 验签）；dev-deps rsa（测试签发用）。
    # 影响界定：Marvin 针对 RSA **解密/私钥操作**；生产进程仅做**公钥验签**
    # （openidconnect），不执行任何 RSA 私钥操作；测试中的签发使用内嵌测试
    # 密钥（非秘密、仅测试进程）。持续跟踪上游（RustCrypto/rsa）修复。
    "RUSTSEC-2023-0071",
]
