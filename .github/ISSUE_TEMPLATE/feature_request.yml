name: 功能请求
description: 提出一个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 issue，避免重复提交。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么痛点？为什么需要这个功能？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望的行为 / API / 配置形态。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他实现方式（可选）。
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - OIDC 登录/刷新
        - 服务编排 (pipeline/DAG)
        - 反向代理
        - 管理 API / Admin UI
        - 脚本引擎 (Rhai)
        - Provider (Redis 等)
        - 配置加载
        - 其他
