name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 注意——`-D warnings` 只允许出现在 clippy 步骤的显式参数中。
  # 若作为全局 RUSTFLAGS 注入，会连 `cargo test` 的 rustc 编译一起打死（历史事故）。

jobs:
  audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 依赖漏洞与维护状态审计。
      # 例外清单在 .cargo/audit.toml（每条均有整改说明/影响范围界定）
      # RUSTUP_TOOLCHAIN=stable：审计工具链独立于项目 pin——
      # rust-toolchain.toml（1.93.0）可能低于 audit-check 安装 cargo-audit 所需版本。
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RUSTUP_TOOLCHAIN: stable

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    # Redis provider / 跨实例会话用例需要 Redis；提供后不再自动跳过
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      # admin-ui/dist 是 RustEmbed 的编译期强依赖，必须先构建（否则 cargo test 无法编译）
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: Build admin-ui (RustEmbed compile-time dependency)
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
        env:
          # tests/test_redis_providers.rs：跨实例会话/锁/cache（无此变量时自动跳过）
          BFF_TEST_REDIS_URL: redis://127.0.0.1:6379

  coverage:
    name: Coverage (cargo-llvm-cov ≥75% lines)
    runs-on: ubuntu-latest
    # 行覆盖率门禁：当前基线约 79%（含 Redis 用例）；阈值 ≥75 为下限护栏，
    # 新增测试后应逐步上调（棘轮策略）。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      # RustEmbed 编译期强依赖 admin-ui/dist（同 rust job）
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: Build admin-ui (RustEmbed compile-time dependency)
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage gate
        run: cargo llvm-cov --all-features --summary-only --fail-under-lines 75
        env:
          BFF_TEST_REDIS_URL: redis://127.0.0.1:6379

  java:
    name: Java (iam + fakesvc Maven verify)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [iam, fakesvc]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (admin-ui + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意：`setup-node` 的 `cache: pnpm` 要求 pnpm 已在 PATH 中，
      # 因此必须先安装 pnpm 再配置 Node（历史事故：顺序反置时该 job 在
      # "Set up Node 22" 步骤报 `Unable to locate executable file: pnpm`）。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            admin-ui/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install & build admin-ui
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install & build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
