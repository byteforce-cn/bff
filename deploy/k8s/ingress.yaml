# TLS 终止在 Ingress（nginx-ingress 示例；证书由 cert-manager 管理或手工 Secret）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bff
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # SSE：关闭代理缓冲
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # X-Forwarded-* 由 ingress 自动注入；BFF 侧 public_base_url 已固定对外地址
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    # 每个站点子域一张证书（正式环境可用同一泛域名证书；cert-manager 会自动申请）。
    - hosts: ["app1.example.com", "app2.example.com"]
      secretName: bff-tls
  # 每个站点一个 host 规则 → 对应 Service 端口（§11.1）；TLS 在 Ingress 终止。
  # 注意：Host 不命中站点允许主机（server_names ∪ public_base_url 主机）时由 BFF
  # 返回 421 Misdirected Request（§6.3）；nginx-ingress 默认 proxy_next_upstream 为
  # `error timeout`，不含 `http_421`，不会因此重试（自定义列表时需保持这一点）。
  rules:
    - host: app1.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 8081
    - host: app2.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 8082
