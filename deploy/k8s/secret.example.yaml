# 密钥模板：真实值禁止入库（生产用 SealedSecrets / ExternalSecrets / Vault 注入）。
#
#   kubectl create secret generic bff-secrets \
#     --from-literal=BFF_ADMIN__AUTH_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=BFF_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=BFF_SECRET_SALT="$(openssl rand -hex 16)" \
#     --from-literal=BFF_PROVIDER__REDIS_URL="redis://:密码@bff-redis:6379"
apiVersion: v1
kind: Secret
metadata:
  name: bff-secrets
type: Opaque
stringData:
  BFF_ADMIN__AUTH_TOKEN: "REPLACE_ME_32+_RANDOM"
  BFF_SECRET: "REPLACE_ME_32+_RANDOM"
  BFF_SECRET_SALT: "REPLACE_ME_16+_RANDOM"
  BFF_PROVIDER__REDIS_URL: "redis://bff-redis:6379"
  # 注：数组/对象类配置（如 oidc.providers、routes、pipelines）无法经 BFF_* 环境变量注入
  #（figment 仅解析标量），请通过配置文件/ConfigMap 挂载提供；敏感字段可结合 ${ENV:...} 引用。
