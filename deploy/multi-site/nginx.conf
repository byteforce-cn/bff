# 本地双子域 SSO 验收：nginx 反向代理（模拟生产 LB / TLS 终止，§11.2）。
#
# 作用：把 app1.localhost / app2.localhost 分别代理到本机 BFF 的两个站点端口，
# 并固定 `proxy_set_header Host $host;`（剥离端口）模拟生产 Host 透传行为。
# 为什么需要它：host-only cookie 按“主机”（而非端口）共享，纯 localhost:8081/8082
# 无法验证 Domain cookie 语义；跨站 SSO / 站点隔离必须在不同子域下验证（§11.2）。
#
# 启动（需 80 端口权限；Linux/macOS 通常已把 *.localhost 解析到 127.0.0.1）：
#   sudo nginx -c "$PWD/deploy/multi-site/nginx.conf" -g 'daemon off;'
#
# 完整验收步骤见同目录 README.md。

events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 站点 1：app1.localhost → BFF 站点 app1（127.0.0.1:8081）
  # default_server：Host 不匹配任何 server_name 时落到这里，并原样透传该 Host，
  # 从而把“伪造 Host”转给 BFF 校验（预期 421 Misdirected Request，§6.3）。
  server {
    listen 80 default_server;
    server_name app1.localhost;

    client_max_body_size 16m;

    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;

      # 关键：Host 剥端口透传 + X-Forwarded-Proto
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket 升级
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # SSE：关闭缓冲、拉长读超时
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }

  # 站点 2：app2.localhost → BFF 站点 app2（127.0.0.1:8082）
  server {
    listen 80;
    server_name app2.localhost;

    client_max_body_size 16m;

    location / {
      proxy_pass http://127.0.0.1:8082;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
