[package]
name = "bff"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "limit", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
figment = { version = "0.10", features = ["yaml", "env"] }
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
tower-sessions = "0.12"
openidconnect = { version = "3.5", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
petgraph = "0.6"
rquickjs = "0.13"
arc-swap = "1.7"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
tower_governor = "0.4"
governor = "0.6"
ipnet = "2"
url = "2"
base64 = "0.22"
rand = "0.8"
argon2 = "0.5"
anyhow = "1"
thiserror = "1"
futures = "0.3"
humantime-serde = "1"
humantime = "1"
percent-encoding = "2"
sha2 = "0.10"
tokio-tungstenite = { version = "0.21", features = ["connect"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
time = "0.3"

# O3：OTel 分布式追踪（OTLP/gRPC 导出）。
# 版本锁定 0.27/0.28 线（与 tracing-subscriber 0.3 兼容的稳定 API；升级需回归 test_telemetry）。
# tls 走 rustls（tls-roots 读取系统证书库），不引入 openssl（保持 E9 依赖图约束）。
opentelemetry = { version = "0.27", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "grpc-tonic", "tls", "tls-roots"] }
tracing-opentelemetry = { version = "0.28", default-features = false }

[dev-dependencies]
wiremock = "0.6"
# E9：dev-deps 也统一 rustls（原默认特性引入 native-tls/openssl-sys，
# 导致 `cargo test` 依赖系统 libssl-dev/pkg-config）
reqwest = { version = "0.11", default-features = false, features = ["cookies", "json", "rustls-tls"] }
# 真实验签契约测试：进程内生成 RSA 密钥并以 RS256 签发 id_token（tests/test_oidc_signature.rs）。
# 版本与 openidconnect 3.5 传递依赖一致（已在 Cargo.lock / registry 缓存中，无新增供应链面）。
rsa = { version = "0.9", features = ["sha2"] }
# OTel 契约测试：进程内 OTLP/gRPC collector（版本与 opentelemetry-otlp 0.27 对齐）
opentelemetry-proto = { version = "0.27", default-features = false, features = ["gen-tonic", "trace"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }
tokio-stream = { version = "0.1", features = ["net"] }

# E6：release 构建优化（体积/性能）
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
