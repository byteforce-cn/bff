[package]
name = "bff"
version = "0.1.0"
edition = "2021"
description = "通用型 Backend-For-Frontend 中间件（Rust/Axum）：OIDC 登录、YAML 服务编排、反向代理与内嵌管理台"
license = "MIT"
repository = "https://github.com/byteforce-cn/bff"
rust-version = "1.93"
publish = false

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "limit", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
figment = { version = "0.10", features = ["yaml", "env"] }
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
tower-sessions = "0.12"
# openidconnect 4.0 + oauth2 5 + reqwest 0.12 迁移：移除旧栈
# （h2 0.3 / rustls 0.21 / rustls-webpki 0.101 / hyper 0.14），清零对应审计例外。
# 注意：oauth2 5 起出网客户端直接传 `&reqwest::Client`（已实现 `AsyncHttpClient`），
# 旧闭包式 `async_http_client` 已移除（共享客户端带超时/禁重定向，见 `state.rs::build_http_client`）。
openidconnect = { version = "4.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
petgraph = "0.6"
rquickjs = "0.13"
arc-swap = "1.7"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
tower_governor = "0.4"
governor = "0.6"
ipnet = "2"
url = "2"
base64 = "0.22"
rand = "0.8"
argon2 = "0.5"
anyhow = "1"
thiserror = "1"
futures = "0.3"
humantime-serde = "1"
humantime = "1"
percent-encoding = "2"
sha2 = "0.10"
tokio-tungstenite = { version = "0.21", features = ["connect"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
time = "0.3"

# OTel 分布式追踪（OTLP/gRPC 导出）。
# 0.33/0.34 线（tracing-opentelemetry 0.34 要求 opentelemetry 0.33；升级需回归 tests/test_telemetry.rs）。
# tls 走 rustls/ring（tls-roots 读取系统证书库），不引入 openssl（保持依赖图约束）。
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-roots"] }
tracing-opentelemetry = { version = "0.34", default-features = false }

[dev-dependencies]
wiremock = "0.6"
# dev-deps 也统一 rustls（原默认特性引入 native-tls/openssl-sys，
# 导致 `cargo test` 依赖系统 libssl-dev/pkg-config）
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
# 真实验签契约测试：进程内生成 RSA 密钥并以 RS256 签发 id_token（tests/test_oidc_signature.rs）。
# 版本与 openidconnect 4.0 传递依赖一致（rsa 0.9 线，Marvin 审计例外维持原界定）。
rsa = { version = "0.9", features = ["sha2"] }
# OTel 契约测试：进程内 OTLP/gRPC collector（版本与 opentelemetry-otlp 0.33 对齐）
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tokio-stream = { version = "0.1", features = ["net"] }

# release 构建优化（体积/性能）
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
